{% extends "base.html" %}
{% block title %}ProNet Graph - Registro de Cuenta{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 bg-dark" id="registerCard" style="border-top: 4px solid #4CAF50 !important;">
            <div class="card-header bg-transparent text-center pt-4 pb-2 border-0">
                <i class="fas fa-user-plus fa-3x text-success mb-2" id="registerIcon"></i>
                <h3 class="text-white fw-bold" id="registerTitle">Crear Cuenta Profesional</h3>
                <p class="text-muted small">Únete a la red profesional basada en grafos</p>
                
                <!-- Account Type Selector -->
                <div class="btn-group w-100 mt-2 mb-2" role="group">
                    <input type="radio" class="btn-check" name="btnTipo" id="tipoUsuario" autocomplete="off" checked onchange="toggleAccountType('usuario')">
                    <label class="btn btn-outline-success" for="tipoUsuario">
                        <i class="fas fa-user me-1"></i>Profesional / Candidato
                    </label>

                    <input type="radio" class="btn-check" name="btnTipo" id="tipoEmpresa" autocomplete="off" onchange="toggleAccountType('empresa')">
                    <label class="btn btn-outline-primary" for="tipoEmpresa">
                        <i class="fas fa-building me-1"></i>Empresa / Empleador
                    </label>
                </div>
            </div>
            <div class="card-body px-4 py-3">
                <form method="POST" action="/register">
                    <input type="hidden" name="tipo" id="inputTipo" value="usuario">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label text-light small fw-bold" id="lblNombre">Nombre Completo *</label>
                            <input type="text" name="nombre" id="regNombre" class="form-control border-secondary bg-black text-light" placeholder="ej. Andrés Gómez" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-light small fw-bold" id="lblEmail">Correo Electrónico *</label>
                            <input type="email" name="email" id="regEmail" class="form-control border-secondary bg-black text-light" placeholder="andres@ejemplo.com" required>
                        </div>
                        
                        <!-- User Specific Fields -->
                        <div class="col-md-6 field-usuario">
                            <label class="form-label text-light small fw-bold">Título / Rol Profesional</label>
                            <input type="text" name="titulo" id="regTitulo" class="form-control border-secondary bg-black text-light" placeholder="ej. Ingeniero de Software">
                        </div>

                        <!-- Empresa Specific Fields -->
                        <div class="col-md-6 field-empresa" style="display:none;">
                            <label class="form-label text-light small fw-bold">Industria / Sector</label>
                            <input type="text" name="industria" id="regIndustria" class="form-control border-secondary bg-black text-light" placeholder="ej. Tecnología, Finanzas">
                        </div>
                        <div class="col-md-6 field-empresa" style="display:none;">
                            <label class="form-label text-light small fw-bold">Sitio Web</label>
                            <input type="url" name="sitio_web" id="regSitioWeb" class="form-control border-secondary bg-black text-light" placeholder="https://miempresa.com">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-light small fw-bold">Ciudad / Ubicación</label>
                            <input type="text" name="ubicacion" id="regUbicacion" class="form-control border-secondary bg-black text-light" placeholder="ej. Bogotá, Colombia">
                        </div>

                        <div class="col-12">
                            <label class="form-label text-light small fw-bold">Contraseña *</label>
                            <input type="password" name="password" id="regPassword" class="form-control border-secondary bg-black text-light" placeholder="Mínimo 6 caracteres" required>
                        </div>

                        <div class="col-12 field-usuario">
                            <label class="form-label text-light small fw-bold">Resumen Profesional</label>
                            <textarea name="resumen" class="form-control border-secondary bg-black text-light" rows="3" placeholder="Describe brevemente tu trayectoria, áreas de interés o especialidad..."></textarea>
                        </div>

                        <div class="col-12 field-empresa" style="display:none;">
                            <label class="form-label text-light small fw-bold">Descripción de la Empresa</label>
                            <textarea name="descripcion" class="form-control border-secondary bg-black text-light" rows="3" placeholder="Describe qué hace tu empresa, tamaño y cultura corporativa..."></textarea>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold mt-4 mb-3" id="btnSubmit">
                        <i class="fas fa-check-circle me-2"></i>Registrarme e Iniciar Sesión
                    </button>
                </form>

                <div class="text-center mt-2 pt-2 border-top border-secondary">
                    <small class="text-muted">¿Ya tienes cuenta? <a href="/login" class="text-info fw-bold text-decoration-none">Inicia sesión aquí</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function toggleAccountType(tipo) {
    document.getElementById('inputTipo').value = tipo;
    const isEmp = tipo === 'empresa';
    
    // Card header styling
    const card = document.getElementById('registerCard');
    const icon = document.getElementById('registerIcon');
    const title = document.getElementById('registerTitle');
    const btn = document.getElementById('btnSubmit');

    if (isEmp) {
        card.style.borderTop = '4px solid #2196F3 !important';
        icon.className = 'fas fa-building fa-3x text-primary mb-2';
        title.textContent = 'Crear Cuenta de Empresa';
        btn.className = 'btn btn-primary w-100 py-2 fw-bold mt-4 mb-3';
        document.getElementById('lblNombre').textContent = 'Nombre de la Empresa *';
        document.getElementById('regNombre').placeholder = 'ej. TechSolutions SAS';
        document.getElementById('lblEmail').textContent = 'Correo Corporativo *';
        document.getElementById('regEmail').placeholder = 'talento@techsolutions.com';

        document.querySelectorAll('.field-usuario').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.field-empresa').forEach(el => el.style.display = 'block');
    } else {
        card.style.borderTop = '4px solid #4CAF50 !important';
        icon.className = 'fas fa-user-plus fa-3x text-success mb-2';
        title.textContent = 'Crear Cuenta Profesional';
        btn.className = 'btn btn-success w-100 py-2 fw-bold mt-4 mb-3';
        document.getElementById('lblNombre').textContent = 'Nombre Completo *';
        document.getElementById('regNombre').placeholder = 'ej. Andrés Gómez';
        document.getElementById('lblEmail').textContent = 'Correo Electrónico *';
        document.getElementById('regEmail').placeholder = 'andres@ejemplo.com';

        document.querySelectorAll('.field-usuario').forEach(el => el.style.display = 'block');
        document.querySelectorAll('.field-empresa').forEach(el => el.style.display = 'none');
    }
}
</script>
{% endblock %}
