{% extends "base.html" %}
{% block title %}ProNet Graph - Registro de Usuario{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 bg-dark" style="border-top: 4px solid #4CAF50 !important;">
            <div class="card-header bg-transparent text-center pt-4 pb-2 border-0">
                <i class="fas fa-user-plus fa-3x text-success mb-2"></i>
                <h3 class="text-white fw-bold">Crear Cuenta Profesional</h3>
                <p class="text-muted small">Únete a la red profesional basada en grafos</p>
            </div>
            <div class="card-body px-4 py-3">
                <form method="POST" action="/register">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label text-light small fw-bold">Nombre Completo</label>
                            <input type="text" name="nombre" class="form-control border-secondary bg-black text-light" placeholder="ej. Andrés Gómez" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-light small fw-bold">Correo Electrónico</label>
                            <input type="email" name="email" class="form-control border-secondary bg-black text-light" placeholder="andres@ejemplo.com" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-light small fw-bold">Título / Rol Profesional</label>
                            <input type="text" name="titulo" class="form-control border-secondary bg-black text-light" placeholder="ej. Ingeniero de Software" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-light small fw-bold">Ciudad / Ubicación</label>
                            <input type="text" name="ubicacion" class="form-control border-secondary bg-black text-light" placeholder="ej. Bogotá, Colombia">
                        </div>
                        <div class="col-12">
                            <label class="form-label text-light small fw-bold">Contraseña</label>
                            <input type="password" name="password" class="form-control border-secondary bg-black text-light" placeholder="Mínimo 6 caracteres" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label text-light small fw-bold">Resumen Profesional</label>
                            <textarea name="resumen" class="form-control border-secondary bg-black text-light" rows="3" placeholder="Describe brevemente tu trayectoria, áreas de interés o especialidad..."></textarea>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold mt-4 mb-3">
                        <i class="fas fa-check-circle me-2"></i>Registrarme e Iniciar Sesión
                    </button>
                </form>

                <div class="text-center mt-2 pt-2 border-top border-secondary">
                    <small class="text-muted">¿Ya tienes cuenta? <a href="/login" class="text-info fw-bold text-decoration-none">Inicia sesión aquí</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
