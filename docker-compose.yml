services:
  neo4j:
    image: neo4j:5.26.0-community
    container_name: neo4j_pronet
    restart: unless-stopped
    ports:
      - "7475:7474" # Browser HTTP (puerto libre)
      - "7688:7687" # Bolt protocol (puerto libre)
    environment:
      - NEO4J_AUTH=none
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
